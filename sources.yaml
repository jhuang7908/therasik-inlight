# 每周抓取的固定来源。改名单只改这个文件，不要改 Python。
# kind: academic 学术 / industry 行业
# type: rss 或 pubmed 或 manual (manual 不自动抓)
# feed 或 query 必填。url 是给人看的站点首页。
# needs_browser_ua: true 表示需要用浏览器 User-Agent 抓取

window_days: 7
max_per_source: 6
max_academic: 6
max_industry: 4

sources:
  # ACIR 没有 RSS，需要人工录入或专门爬虫
  - name: ACIR 周报
    kind: academic
    type: manual
    url: https://acir.org/weekly-digests
    note: "ACIR has no RSS feed. Check weekly-digests page manually or scrape."

  - name: Nature
    kind: academic
    type: rss
    url: https://www.nature.com
    feed: https://www.nature.com/nature.rss

  - name: Nature Medicine
    kind: academic
    type: rss
    url: https://www.nature.com/nm
    feed: https://www.nature.com/nm.rss

  - name: Nature Biotechnology
    kind: academic
    type: rss
    url: https://www.nature.com/nbt
    feed: https://www.nature.com/nbt.rss

  - name: Science
    kind: academic
    type: rss
    url: https://www.science.org
    feed: https://www.science.org/rss/news_current.xml

  - name: Cell
    kind: academic
    type: rss
    url: https://www.cell.com
    feed: https://www.cell.com/cell/current.rss
    window_days: 14  # Cell issue dates (00:00 UTC) often fall just outside a 10-day window

  - name: bioRxiv 免疫学
    kind: academic
    type: rss
    url: https://www.biorxiv.org/collection/immunology
    feed: https://connect.biorxiv.org/biorxiv_xml.php?subject=immunology
    needs_browser_ua: true
    biorxiv_category: immunology  # For API fallback when RSS fails

  - name: PubMed
    kind: academic
    type: pubmed
    url: https://pubmed.ncbi.nlm.nih.gov/
    query: organoid OR "CAR-T" OR "lipid nanoparticle" OR "mRNA vaccine" OR "autoimmune"

  - name: Endpoints News
    kind: industry
    type: rss
    url: https://endpts.com
    feed: https://endpts.com/feed/
    needs_browser_ua: true

  - name: Fierce Biotech
    kind: industry
    type: rss
    url: https://news.google.com
    feed: https://news.google.com/rss/search?q=site:fiercebiotech.com+when:7d&hl=en-US&gl=US&ceid=US:en
    note: "Fierce Biotech blocks server IPs. Using Google News RSS as proxy."

  - name: BioPharma Dive
    kind: industry
    type: rss
    url: https://www.biopharmadive.com
    feed: https://www.biopharmadive.com/feeds/news/

  - name: STAT News
    kind: industry
    type: rss
    url: https://www.statnews.com
    feed: https://www.statnews.com/feed/

  - name: FDA 公告
    kind: industry
    type: rss
    url: https://www.federalregister.gov
    feed: https://www.federalregister.gov/api/v1/documents.rss?conditions%5Bagencies%5D%5B%5D=food-and-drug-administration
    note: "FDA direct feeds blocked. Using Federal Register API."

  - name: EMA
    kind: industry
    type: rss
    url: https://www.ema.europa.eu/en/news
    feed: https://www.ema.europa.eu/en/news.xml

# 上市公司公告（一手来源，优先于媒体）。由 filings.py 抓取，单个来源出错只记日志、不影响其它来源。
# 抓到的公告进入允许引用的 URL 列表，kind 为 filing。
filings:
  enabled: true
  window_days: 7
  max_items: 12          # 送给模型的公告总数上限
  max_per_exchange: 5    # 每个平台最多几条，避免一家挤掉其它
  fetch_excerpts: true   # 下载公告正文前几页做摘录（PDF 需要 pdftotext）
  edgar:
    # SEC EDGAR 全文检索 efts.sec.gov；User-Agent 带 contact@inlightbio.com；限速 <=10 次/秒
    max_rps: 5
    sics: ["2833", "2834", "2835", "2836", "8731", "8733"]  # 只保留医药/生物技术公司
    queries:
      - q: '"exclusive license" "Greater China"'
        forms: 8-K,6-K,10-Q,20-F
      - q: '"exclusive license agreement"'
        forms: 8-K,6-K
      - q: '"NewCo"'
        forms: 8-K,6-K
      - q: '"upfront payment" "license agreement"'
        forms: 8-K,6-K
  hkex:
    # 披露易按日期检索（中文标题，本地过滤）+ 最新披露 feed
    watchlist: ["02162", "01276", "03692", "09995", "02142", "06990", "01093", "01177", "01801", "09926"]
  cninfo:
    # 巨潮资讯公告检索（沪深两市）
    keywords: [授权许可, 独家许可, 合作协议, 合资, 设立公司, 首付款, 里程碑]
    exclude: [生产许可证, 上市许可申请, 注册证]
